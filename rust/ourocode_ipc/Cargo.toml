[package]
name = "ourocode_ipc"
version = "0.1.0"
edition = "2021"
description = "Rust-side IPC/RPC request decoding for ourocode helper workers"
publish = false

[lib]
name = "ourocode_ipc"
path = "src/lib.rs"

[[bin]]
name = "ourocode_tty"
path = "src/bin/ourocode_tty.rs"

[dependencies]
serde_json = "1"
libc = "0.2"
